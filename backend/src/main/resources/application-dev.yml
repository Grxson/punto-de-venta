spring:
  datasource:
    url: "jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:railway}"
    username: "${DB_USER:postgres}"
    password: "${DB_PASSWORD:}"
    driver-class-name: "org.postgresql.Driver"
    hikari:
      maximum-pool-size: 5
      minimum-idle: 2
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
  jpa:
    database-platform: "org.hibernate.dialect.PostgreSQLDialect"
    hibernate:
      ddl-auto: "validate"
    show-sql: true
    properties:
      hibernate.format_sql: true
      hibernate.use_sql_comments: true
    open-in-view: false
  sql:
    init:
      mode: "never"

springdoc:
  api-docs:
    path: "/api-docs"
  swagger-ui:
    path: "/swagger-ui.html"
    enabled: true
    operations-sorter: "method"
    tags-sorter: "alpha"
    doc-expansion: "none"
    disable-swagger-default-url: true
  info:
    title: "Punto de Venta API"
    description: "API RESTful para gestión de ventas, inventario, finanzas y reportes"
    version: "@app.version@"
    contact:
      name: "Grxson"
      url: "https://github.com/Grxson/punto-de-venta"
    license:
      name: "MIT"
      url: "https://opensource.org/licenses/MIT"

cors:
  allowed-origins: "http://localhost:3000,http://localhost:19006,http://localhost:5173,http://localhost:5174,http://localhost:5175,capacitor://localhost,http://localhost,https://localhost"
  allowed-methods: "GET,POST,PUT,PATCH,DELETE,OPTIONS"
  allowed-headers: "*"

app:
  version: "@app.version@"
  build: "@app.build@"
  description: "API RESTful para sistema de Punto de Venta"
